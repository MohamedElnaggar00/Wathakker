name: Export build artifact APK to dist
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Build Android APK run id whose APK artifact should be exported to dist/
        required: true
permissions:
  contents: write
  actions: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist dl
          gh run download "${{ inputs.run_id }}" -n app-release-bom-2025.10.01.apk -D dl
          ls -la dl/
          cp dl/*.apk dist/
          sha256sum dist/*.apk | tee dist/SHA256.txt
      - name: Commit APK
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/
          git commit -m "Export run ${{ inputs.run_id }} APK to dist [skip ci]" || echo none
          for i in 1 2 3 4; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
