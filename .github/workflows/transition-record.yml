name: transition-record (one-off)
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download fixed build artifact
        uses: actions/download-artifact@v4
        with:
          name: app-release-bom-2025.10.01.apk
          run-id: 39104073859
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: built
      - name: Download published v3.1.0 apk (old)
        run: curl -sL -o old.apk "https://github.com/MohamedElnaggar00/Wathakker/releases/download/v3.1.0/Wathakker-v3.1.0.apk" && ls -l old.apk built
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Run record harness
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: false
          script: bash tools/emu_transition_record.sh old.apk built/app-release-unsigned.apk emulator-evidence/transition310
      - name: Commit evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add emulator-evidence
          git commit -m "transition + picker evidence 3.1.0-update [skip ci]" || echo none
          for i in 1 2 3 4; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
