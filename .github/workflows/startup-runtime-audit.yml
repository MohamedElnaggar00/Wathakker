name: Validate ART startup fix and data-preserving upgrade
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/startup-runtime-audit.yml]
permissions:
  contents: read
  actions: read
jobs:
  runtime-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: Wathakker-V3.0.4-release
          run-id: 38179573292
          github-token: ${{ github.token }}
          path: shipped
      - uses: actions/download-artifact@v4
        with:
          name: Wathakker-V3.0.1-release
          run-id: 38166133673
          github-token: ${{ github.token }}
          path: old
      - name: Patch exact shipped DEX only
        run: |
          echo '034a37d6d48541cb9f9443c944726a9517c380b3a96a3af4ecbaddb1bedf5944  shipped/Wathakker-V3.0.4.apk' | sha256sum -c
          PATCH=$(find . -maxdepth 1 -name '*startup-art-verifier-fix.zip' -print -quit)
          test -n "$PATCH"
          echo "488a1c2b07e2f944ef4a08d8c049ff64000d620c9b0f6737a45b892f25daa354  $PATCH" | sha256sum -c
          unzip -q "$PATCH" -d patch
          python3 - <<'PYCODE'
          import zipfile
          src=zipfile.ZipFile('shipped/Wathakker-V3.0.4.apk')
          with zipfile.ZipFile('candidate-unsigned.apk','w') as dst:
            for i in src.infolist():
              if i.filename.startswith('META-INF/') and i.filename.endswith(('.RSA','.SF','.MF')):continue
              dst.writestr(i,open('patch/classes6.dex','rb').read() if i.filename=='classes6.dex' else src.read(i.filename))
          PYCODE
          mkdir -p runtime-evidence
      - name: Ensure signing tools are installed
        run: |
          MANAGER=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | head -1)
          "$MANAGER" 'build-tools;36.0.0'
      - name: Sign diagnostic candidate with existing Morphe key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          umask 077
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$work/source.bks"
          curl -fsSL https://repo.maven.apache.org/maven2/org/bouncycastle/bcprov-jdk18on/1.78.1/bcprov-jdk18on-1.78.1.jar -o "$work/bcprov.jar"
          echo "add5915e6acfc6ab5836e1fd8a5e21c6488536a8c1f21f386eeb3bf280b702d7  $work/bcprov.jar" | sha256sum -c
          cp 1-ConvertBks.java "$work/ConvertBks.java"
          javac -cp "$work/bcprov.jar" -d "$work" "$work/ConvertBks.java"
          java -cp "$work:$work/bcprov.jar" ConvertBks "$work/source.bks" "$work/signing.p12"
          BT="$ANDROID_HOME/build-tools/36.0.0"
          "$BT/zipalign" -f -p 4 candidate-unsigned.apk "$work/aligned.apk"
          "$BT/apksigner" sign --ks "$work/signing.p12" --ks-type PKCS12 --ks-key-alias "$KEY_ALIAS" --ks-pass env:KEY_PASSWORD --key-pass env:KEY_PASSWORD --out candidate.apk "$work/aligned.apk"
          "$BT/apksigner" verify --verbose --print-certs candidate.apk > runtime-evidence/signature.txt
          grep -q '0a8b609561f299eaba4518c57e558d506e3991bd0ac551cc167716241adad55f' runtime-evidence/signature.txt
          sha256sum candidate.apk > runtime-evidence/candidate-sha256.txt
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test clean startup and same-key in-place upgrade
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            adb install candidate.apk
            adb logcat -c
            adb shell am start -W -n com.wathakker.app/com.example.MainActivity > runtime-evidence/fresh-launch.txt 2>&1
            sleep 8
            adb logcat -d -v threadtime > runtime-evidence/fresh-logcat.txt
            adb shell screencap -p /sdcard/startup.png
            adb pull /sdcard/startup.png runtime-evidence/fresh-screen.png
            adb shell uiautomator dump /sdcard/fresh.xml
            adb pull /sdcard/fresh.xml runtime-evidence/fresh-ui.xml
            adb shell am force-stop com.wathakker.app
            adb uninstall com.wathakker.app
            adb install old/Wathakker-V3.0.1.apk
            adb logcat -c
            adb shell am start -W -n com.wathakker.app/com.example.MainActivity > runtime-evidence/old-launch.txt 2>&1
            sleep 8
            adb logcat -d -v threadtime > runtime-evidence/old-logcat.txt
            adb shell am force-stop com.wathakker.app
            adb install -r candidate.apk
            adb logcat -c
            adb shell am start -W -n com.wathakker.app/com.example.MainActivity > runtime-evidence/upgrade-launch.txt 2>&1
            sleep 8
            adb logcat -d -v threadtime > runtime-evidence/upgrade-logcat.txt
            adb shell screencap -p /sdcard/upgrade.png
            adb pull /sdcard/upgrade.png runtime-evidence/upgrade-screen.png
            adb shell uiautomator dump /sdcard/upgrade.xml
            adb pull /sdcard/upgrade.xml runtime-evidence/upgrade-ui.xml
            adb shell dumpsys activity activities > runtime-evidence/upgrade-activities.txt
            ! grep -q 'FATAL EXCEPTION' runtime-evidence/fresh-logcat.txt
            ! grep -q 'FATAL EXCEPTION' runtime-evidence/upgrade-logcat.txt
      - name: Preserve evidence only, not a delivery APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: startup-fixed-runtime-evidence
          path: runtime-evidence/
          retention-days: 7
