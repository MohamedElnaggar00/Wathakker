name: Validate ART startup fix and data-preserving upgrade
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/startup-runtime-audit.yml]
permissions:
  contents: read
  actions: read
jobs:
  runtime-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: Wathakker-V3.0.4-release
          run-id: 38179573292
          github-token: ${{ github.token }}
          path: shipped
      - uses: actions/download-artifact@v4
        with:
          name: Wathakker-V3.0.1-release
          run-id: 38166133673
          github-token: ${{ github.token }}
          path: old
      - name: Patch exact shipped DEX only
        run: |
          echo '034a37d6d48541cb9f9443c944726a9517c380b3a96a3af4ecbaddb1bedf5944  shipped/Wathakker-V3.0.4.apk' | sha256sum -c
          PATCH=$(find . -maxdepth 1 -name '*startup-art-verifier-fix.zip' -print -quit)
          test -n "$PATCH"
          echo "488a1c2b07e2f944ef4a08d8c049ff64000d620c9b0f6737a45b892f25daa354  $PATCH" | sha256sum -c
          unzip -q "$PATCH" -d patch
          python3 - <<'PYCODE'
          import zipfile,struct
          src=zipfile.ZipFile('shipped/Wathakker-V3.0.4.apk')
          manifest=bytearray(src.read('AndroidManifest.xml'))
          old='3.0.4'.encode('utf-16le');new='3.0.5'.encode('utf-16le')
          assert manifest.count(old)==1
          manifest=manifest.replace(old,new)
          assert struct.unpack_from('<I',manifest,9196)[0]==10
          struct.pack_into('<I',manifest,9196,11)
          with zipfile.ZipFile('candidate-unsigned.apk','w') as dst:
            for i in src.infolist():
              if i.filename.startswith('META-INF/') and i.filename.endswith(('.RSA','.SF','.MF')):continue
              dst.writestr(i,manifest if i.filename=='AndroidManifest.xml' else open('patch/classes6.dex','rb').read() if i.filename=='classes6.dex' else src.read(i.filename))
          PYCODE
          mkdir -p runtime-evidence
      - name: Ensure signing tools are installed
        run: |
          MANAGER=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | head -1)
          "$MANAGER" 'build-tools;36.0.0'
      - name: Sign diagnostic candidate with existing Morphe key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          umask 077
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$work/source.bks"
          curl -fsSL https://repo.maven.apache.org/maven2/org/bouncycastle/bcprov-jdk18on/1.78.1/bcprov-jdk18on-1.78.1.jar -o "$work/bcprov.jar"
          echo "add5915e6acfc6ab5836e1fd8a5e21c6488536a8c1f21f386eeb3bf280b702d7  $work/bcprov.jar" | sha256sum -c
          cp 1-ConvertBks.java "$work/ConvertBks.java"
          javac -cp "$work/bcprov.jar" -d "$work" "$work/ConvertBks.java"
          java -cp "$work:$work/bcprov.jar" ConvertBks "$work/source.bks" "$work/signing.p12"
          BT="$ANDROID_HOME/build-tools/36.0.0"
          "$BT/zipalign" -f -p 4 candidate-unsigned.apk "$work/aligned.apk"
          "$BT/apksigner" sign --ks "$work/signing.p12" --ks-type PKCS12 --ks-key-alias "$KEY_ALIAS" --ks-pass env:KEY_PASSWORD --key-pass env:KEY_PASSWORD --out candidate.apk "$work/aligned.apk"
          "$BT/apksigner" verify --verbose --print-certs candidate.apk > runtime-evidence/signature.txt
          grep -q '0a8b609561f299eaba4518c57e558d506e3991bd0ac551cc167716241adad55f' runtime-evidence/signature.txt
          "$BT/aapt2" dump badging candidate.apk > runtime-evidence/package.txt
          grep -q "name='com.wathakker.app' versionCode='11' versionName='3.0.5'" runtime-evidence/package.txt
          sha256sum candidate.apk > runtime-evidence/candidate-sha256.txt
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test clean startup and same-key in-place upgrade
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            set -eu
            adb root
            adb wait-for-device
            adb install -g candidate.apk
            adb shell pm grant com.wathakker.app android.permission.POST_NOTIFICATIONS
            adb shell am force-stop com.android.permissioncontroller
            adb shell am force-stop com.google.android.permissioncontroller
            adb logcat -c
            adb shell am start -S -W -n com.wathakker.app/com.example.MainActivity > runtime-evidence/fresh-launch.txt 2>&1
            sleep 8
            adb logcat -d -v threadtime > runtime-evidence/fresh-logcat.txt
            adb shell pidof com.wathakker.app > runtime-evidence/fresh-pid.txt
            adb shell dumpsys activity activities > runtime-evidence/fresh-activities.txt
            grep -E '(topResumedActivity=|mResumedActivity:).*com.wathakker.app/com.example.MainActivity' runtime-evidence/fresh-activities.txt
            adb shell screencap -p /sdcard/startup.png
            adb pull /sdcard/startup.png runtime-evidence/fresh-screen.png
            adb shell uiautomator dump /sdcard/fresh.xml
            adb pull /sdcard/fresh.xml runtime-evidence/fresh-ui.xml
            adb shell am force-stop com.wathakker.app
            adb uninstall com.wathakker.app
            adb install -g old/Wathakker-V3.0.1.apk
            adb shell pm grant com.wathakker.app android.permission.POST_NOTIFICATIONS
            adb logcat -c
            adb shell am start -S -W -n com.wathakker.app/com.example.MainActivity > runtime-evidence/old-launch.txt 2>&1
            sleep 8
            adb logcat -d -v threadtime > runtime-evidence/old-logcat.txt
            adb shell am force-stop com.wathakker.app
            adb shell 'find /data/user/0/com.wathakker.app/shared_prefs /data/user/0/com.wathakker.app/databases -type f -exec sha256sum {} \; 2>/dev/null' | sort > runtime-evidence/data-before-upgrade.txt
            test -s runtime-evidence/data-before-upgrade.txt
            adb install -r -g candidate.apk > runtime-evidence/upgrade-install.txt
            adb shell 'find /data/user/0/com.wathakker.app/shared_prefs /data/user/0/com.wathakker.app/databases -type f -exec sha256sum {} \; 2>/dev/null' | sort > runtime-evidence/data-after-upgrade.txt
            diff -u runtime-evidence/data-before-upgrade.txt runtime-evidence/data-after-upgrade.txt > runtime-evidence/data-preservation.diff
            adb shell am force-stop com.android.permissioncontroller
            adb shell am force-stop com.google.android.permissioncontroller
            adb logcat -c
            adb shell am start -S -W -n com.wathakker.app/com.example.MainActivity > runtime-evidence/upgrade-launch.txt 2>&1
            sleep 8
            adb logcat -d -v threadtime > runtime-evidence/upgrade-logcat.txt
            adb shell pidof com.wathakker.app > runtime-evidence/upgrade-pid.txt
            adb shell dumpsys activity activities > runtime-evidence/upgrade-activities.txt
            grep -E '(topResumedActivity=|mResumedActivity:).*com.wathakker.app/com.example.MainActivity' runtime-evidence/upgrade-activities.txt
            adb shell screencap -p /sdcard/upgrade.png
            adb pull /sdcard/upgrade.png runtime-evidence/upgrade-screen.png
            adb shell uiautomator dump /sdcard/upgrade.xml
            adb pull /sdcard/upgrade.xml runtime-evidence/upgrade-ui.xml
            adb shell input tap 970 224
            sleep 2
            adb shell screencap -p /sdcard/drawer.png
            adb pull /sdcard/drawer.png runtime-evidence/drawer-screen.png
            adb shell uiautomator dump /sdcard/drawer.xml
            adb pull /sdcard/drawer.xml runtime-evidence/drawer-ui.xml
            adb shell input keyevent 4
            adb shell input tap 120 224
            sleep 2
            adb shell screencap -p /sdcard/settings.png
            adb pull /sdcard/settings.png runtime-evidence/settings-screen.png
            adb shell uiautomator dump /sdcard/settings.xml
            adb pull /sdcard/settings.xml runtime-evidence/settings-ui.xml
            adb shell input keyevent 4
            adb shell input tap 346 2220
            sleep 2
            adb shell screencap -p /sdcard/fajr.png
            adb pull /sdcard/fajr.png runtime-evidence/fajr-screen.png
            adb shell uiautomator dump /sdcard/fajr.xml
            adb pull /sdcard/fajr.xml runtime-evidence/fajr-ui.xml
            adb shell input tap 735 2220
            sleep 2
            adb shell screencap -p /sdcard/azkar.png
            adb pull /sdcard/azkar.png runtime-evidence/azkar-screen.png
            adb shell input tap 540 2220
            sleep 2
            adb shell screencap -p /sdcard/hisn.png
            adb pull /sdcard/hisn.png runtime-evidence/hisn-screen.png
            adb shell input tap 150 2220
            sleep 2
            adb shell screencap -p /sdcard/tasbih.png
            adb pull /sdcard/tasbih.png runtime-evidence/tasbih-screen.png
            adb logcat -d -v threadtime > runtime-evidence/navigation-logcat.txt
            adb shell pidof com.wathakker.app > runtime-evidence/navigation-pid.txt
            ! grep -q 'FATAL EXCEPTION' runtime-evidence/fresh-logcat.txt
            ! grep -q 'FATAL EXCEPTION' runtime-evidence/upgrade-logcat.txt
            ! grep -q 'FATAL EXCEPTION' runtime-evidence/navigation-logcat.txt
      - name: Preserve final signed private candidate after runtime gates
        uses: actions/upload-artifact@v4
        with:
          name: Wathakker-V3.0.5-private-validated
          path: candidate.apk
          retention-days: 7
      - name: Preserve runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: startup-fixed-runtime-evidence
          path: runtime-evidence/
          retention-days: 7
