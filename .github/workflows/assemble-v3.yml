name: assemble-v3

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble app module from reference decompile
        run: python3 tools/assemble_v3.py
      - name: Commit to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A app
          git commit -m "app: v3.0.6 source assembled from decompile (applicationId com.wathakker.app, vc 12)" || echo "nothing to commit"
          git push origin HEAD:main
      - name: Dispatch build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-apk.yml --ref main
