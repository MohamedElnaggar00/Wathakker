name: jadx-reference

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  jadx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run jadx
        run: |
          curl -sL -o jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.0/jadx-1.5.0.zip
          unzip -q jadx.zip -d jadx
          APK=$(ls *Wathakker-V3.0.6-41218fbf.apk | head -1)
          echo "$APK"
          sha256sum "$APK"
          jadx/bin/jadx --show-bad-code -j 2 -d /tmp/jx "$APK" || true
          find /tmp/jx -name '*.java' | wc -l
          rm -rf reference/jadx
          mkdir -p reference/jadx
          cp -r /tmp/jx/sources/com/example reference/jadx/ || true
          cp -r /tmp/jx/sources/com/wathakker reference/jadx/ 2>/dev/null || true
          find reference/jadx -name '*.java' | wc -l
      - name: Commit to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reference/jadx
          git commit -m "reference: full jadx output for app classes (v3.0.6)" || echo "nothing to commit"
          git push origin HEAD:main
