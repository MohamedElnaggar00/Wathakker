name: Prepare 3.2.1 build 58 candidate (NO RELEASE)
'on':
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Commit build 58 sources
      run: |
        set -euo pipefail
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        sed -i "s@adb shell date '+%Y-%m-%d %H:%M:%S %Z'@adb shell date +%s@" tools/emu_verify_321.sh
        sed -i 's/int(m)+20/int(m)+30/g' tools/emu_verify_320.sh
        git add app tools .github
        git commit -m 'Fix iqama phase on prayer card and all countdown widgets (3.2.1, build 58) [skip ci]' || true
        git push origin HEAD:main
        mkdir -p test-classes
        javac -d test-classes app/src/main/java/com/example/lockwidgets/PrayerPhase.java tools/PrayerPhaseTest.java
        java -cp test-classes PrayerPhaseTest
    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: temurin
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 9.3.1
    - name: Generate Debug Keystore
      run: keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "C=US, O=Android, CN=Android Debug"
    - name: Build APK
      id: build
      run: |
        set -o pipefail
        gradle assembleRelease -PcomposeBom=2025.10.01 --no-daemon --no-build-cache --no-configuration-cache -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8 -Djava.awt.headless=true" 2>&1 | tee build.log
    - name: Sign with release key
      id: sign
      if: steps.build.outcome == 'success'
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ''
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      run: |
        bash -c 'set -euo pipefail
        umask 077
        work=$(mktemp -d)
        for name in KEYSTORE_BASE64 KEY_ALIAS; do
          if [ -z "${!name}" ]; then echo "Missing signing secret: $name"; exit 1; fi
        done
        printf "%s" "$KEYSTORE_BASE64" | base64 --decode > "$work/source.bks"
        curl --fail --silent --show-error --location https://repo.maven.apache.org/maven2/org/bouncycastle/bcprov-jdk18on/1.78.1/bcprov-jdk18on-1.78.1.jar -o "$work/bcprov.jar"
        echo "add5915e6acfc6ab5836e1fd8a5e21c6488536a8c1f21f386eeb3bf280b702d7  $work/bcprov.jar" | sha256sum --check
        cp 1-ConvertBks.java "$work/ConvertBks.java"
        javac -cp "$work/bcprov.jar" -d "$work" "$work/ConvertBks.java"
        java -cp "$work:$work/bcprov.jar" ConvertBks "$work/source.bks" "$work/signing.p12"
        BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
        APK=app/build/outputs/apk/release/app-release-unsigned.apk
        "$BT/zipalign" -f -p 4 "$APK" "$work/aligned.apk"
        "$BT/apksigner" sign --ks "$work/signing.p12" --ks-type PKCS12 --ks-key-alias "$KEY_ALIAS" --ks-pass env:KEY_PASSWORD --key-pass env:KEY_PASSWORD --out "$APK" "$work/aligned.apk"
        "$BT/apksigner" verify --verbose --print-certs "$APK" > "$work/sig.txt"
        if grep -q 0a8b609561f299eaba4518c57e558d506e3991bd0ac551cc167716241adad55f "$work/sig.txt"; then echo signed-with-original-cert; else echo CERT-MISMATCH; exit 1; fi
        rm -rf "$work"
        ' 2>&1 | tee sign.log; test ${PIPESTATUS[0]} -eq 0
    - name: Package candidate and signature evidence
      run: |
        mkdir -p candidate
        cp app/build/outputs/apk/release/app-release-unsigned.apk candidate/Wathakker-3.2.1.apk
        BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
        "$BT/apksigner" verify --verbose --print-certs candidate/Wathakker-3.2.1.apk > candidate/signature.txt
        "$BT/aapt2" dump badging candidate/Wathakker-3.2.1.apk > candidate/package.txt
        sha256sum candidate/Wathakker-3.2.1.apk > candidate/SHA256SUMS
        bash tools/build_widget_host.sh
        mkdir -p tools/phase-dex
        "$BT/d8" --min-api 26 --output tools/phase-dex test-classes/com/example/lockwidgets/PrayerPhase.class test-classes/PrayerPhaseTest.class
        cp tools/phase-dex/classes.dex tools/phase-test.dex
    - uses: actions/upload-artifact@v4
      with:
        name: Wathakker-3.2.1-b58-candidate
        path: candidate/
        retention-days: 14
    - name: Enable KVM
      run: |-
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: Emulator boundary, live widget and 3.2.0 regression checks
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 35
        arch: x86_64
        target: default
        profile: pixel_6
        disable-animations: false
        script: |-
          bash tools/emu_verify_58.sh candidate/Wathakker-3.2.1.apk emulator-evidence/extra58 dist/3.2.1-b57-candidate/Wathakker-3.2.1.apk
          bash tools/emu_verify_55.sh candidate/Wathakker-3.2.1.apk emulator-evidence/verify58
    - name: Upload evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Wathakker-3.2.1-b58-evidence
        path: |-
          emulator-evidence/verify58/
          emulator-evidence/extra58/
        retention-days: 14
    - name: Save reviewed candidate and evidence without publishing
      if: always()
      run: |-
        mkdir -p dist/3.2.1-b58-candidate
        cp candidate/* dist/3.2.1-b58-candidate/ || true
        mkdir -p emulator-evidence/extra58 emulator-evidence/verify58
        git add emulator-evidence/extra58 emulator-evidence/verify58 dist/3.2.1-b58-candidate
        git commit -m '3.2.1 candidate and emulator evidence [skip ci]' || true
        for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
