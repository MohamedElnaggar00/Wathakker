name: Widget sharpness and tablet drawer evidence (NO RELEASE)
'on':
  workflow_dispatch:
    inputs:
      ref:
        description: commit to test
        default: main
permissions:
  contents: read
jobs:
  sharp:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ALL: 'true'
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.ref || 'main' }}
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: temurin
    - uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 9.3.1
    - name: Generate Debug Keystore
      run: keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "C=US, O=Android, CN=Android Debug"
    - name: Build debug APK
      run: set -o pipefail; gradle :app:assembleDebug -PcomposeBom=2025.10.01 --no-daemon --no-build-cache --no-configuration-cache -Dorg.gradle.jvmargs="-Xmx3g" 2>&1 | tail -30
    - name: Enable KVM
      run: |-
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: Evidence
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 34
        arch: x86_64
        target: google_apis
        profile: pixel_tablet
        disable-animations: true
        script: bash tools/sharp_check.sh app/build/outputs/apk/debug/app-debug.apk emulator-evidence/sharp
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: sharp-evidence
        path: emulator-evidence/sharp/
