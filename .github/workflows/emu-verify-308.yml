name: Emulator verify 3.0.8
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Latest successful build run
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "id=$(gh run list --workflow build-apk.yml --status success --limit 1 --json databaseId -q '.[0].databaseId')" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: app-debug-bom-2025.10.01.apk
          run-id: ${{ steps.latest.outputs.id }}
          github-token: ${{ github.token }}
          path: built
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify 3.0.8 fixes (animations on, screen recorded)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: false
          script: |
            bash tools/emu_verify_308.sh built/app-debug.apk emulator-evidence/verify308
      - name: Commit evidence
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add emulator-evidence
          git commit -m "emulator verify 3.0.8 run ${{ github.run_id }} [skip ci]" || echo none
          for i in 1 2 3 4; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
