name: Phone widget bitmap old vs new (NO RELEASE)
'on':
  workflow_dispatch:
    inputs:
      old_ref:
        description: 'old commit'
        required: true
      new_ref:
        description: 'new commit'
        required: true
permissions:
  contents: read
  actions: read
jobs:
  diff:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.old_ref }}
        path: old
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.new_ref }}
        path: new
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: temurin
    - uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 9.3.1
    - name: Generate Debug Keystore
      run: |-
        keytool -genkey -v -keystore old/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "C=US, O=Android, CN=Android Debug"
        cp old/debug.keystore new/debug.keystore
    - name: Build old
      run: cd old && set -o pipefail; gradle :app:assembleDebug -PcomposeBom=2025.10.01 --no-daemon --no-build-cache --no-configuration-cache -Dorg.gradle.jvmargs="-Xmx3g" 2>&1 | tail -5
    - name: Build new
      run: cd new && set -o pipefail; gradle :app:assembleDebug -PcomposeBom=2025.10.01 --no-daemon --no-build-cache --no-configuration-cache -Dorg.gradle.jvmargs="-Xmx3g" 2>&1 | tail -5
    - name: Enable KVM
      run: |-
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: Render on phone emulator
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 34
        arch: x86_64
        target: google_apis
        profile: pixel_6
        disable-animations: true
        script: bash new/tools/render_diff.sh old/app/build/outputs/apk/debug/app-debug.apk new/app/build/outputs/apk/debug/app-debug.apk evidence
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: render-diff
        path: evidence/
