name: Generate light-theme picker previews
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: 'build-apk.yml run id whose artifact contains the extended WidgetRenderCheck'
        required: true

permissions:
  contents: write

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pillow
      - name: Download APK from build run
        uses: actions/download-artifact@v4
        with:
          name: app-release-bom-2025.10.01.apk
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: built
      - name: Render light previews on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          script: bash tools/emu_gen_light_previews.sh built/app-release-unsigned.apk gen || true
      - name: Save forensics
        if: always()
        run: |
          mkdir -p emulator-evidence/previews-light/forensics
          cp -r gen/. emulator-evidence/previews-light/forensics/ 2>/dev/null || true
      - name: Gate on render success
        run: |
          NPNG=$(ls gen/files/preview_light_*.png 2>/dev/null | wc -l)
          NERR=$(ls gen/files/preview_light_*.err 2>/dev/null | wc -l)
          echo "light renders: $NPNG, errors: $NERR"
          if [ "$NERR" != "0" ] || [ "$NPNG" != "10" ]; then
            echo "GATE FAIL"; ls gen/files; exit 1
          fi
      - name: Install light home previews into drawable-notnight-nodpi
        run: |
          set -e
          mkdir -p app/src/main/res/drawable-notnight-nodpi
          declare -A M=( [Hero]=hero [HeroLarge]=hero_large [Schedule]=schedule [Clock]=clock [Hijri]=hijri [Gregorian]=gregorian [NextPrayer]=next_prayer [PrayerBar]=prayer_bar [DayPrayer]=day_prayer [Pill]=pill )
          for K in "${!M[@]}"; do
            cp "gen/files/preview_light_${K}.png" "app/src/main/res/drawable-notnight-nodpi/home_preview_${M[$K]}.png"
          done
          ls -la app/src/main/res/drawable-notnight-nodpi/
      - name: Generate light lock previews (XML + PNG flips)
        run: python3 tools/gen_light_lock_previews.py
      - name: Contact sheet evidence
        run: |
          python3 - <<'PY'
          import glob
          from PIL import Image, ImageDraw
          files = sorted(glob.glob('app/src/main/res/drawable-notnight-nodpi/home_preview_*.png')) + \
                  sorted(glob.glob('app/src/main/res/drawable-notnight-hdpi/lock_preview_*.png'))
          W = 900; pad = 30; labelh = 24
          rows = []
          for f in files:
              im = Image.open(f).convert('RGBA')
              scale = min(1.0, 640 / im.width)
              im = im.resize((int(im.width*scale), int(im.height*scale)))
              rows.append((f, im))
          H = sum(im.height + labelh + pad for _, im in rows) + pad
          sheet = Image.new('RGBA', (W, H), (255, 255, 255, 255))
          d = ImageDraw.Draw(sheet)
          y = pad
          for f, im in rows:
              d.text((pad, y), f.split('/')[-1], fill=(0,0,0,255))
              y += labelh
              sheet.paste(im, (pad, y), im)
              y += im.height + pad
          import os
          os.makedirs('emulator-evidence/previews-light', exist_ok=True)
          sheet.save('emulator-evidence/previews-light/contact_sheet.png')
          print('sheet saved', sheet.size)
          PY
      - name: Commit
        if: always()
        run: |
          git config user.email "actions@github.com"; git config user.name "github-actions"
          git add emulator-evidence/previews-light || true
          git add app/src/main/res/drawable-notnight* 2>/dev/null || true
          git commit -m "light-theme picker previews (notnight variants) [skip ci]" || echo none
          for i in 1 2 3 4; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
