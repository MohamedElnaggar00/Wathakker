name: retag-310
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - name: Move v3.1.0 tag to the verified build commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh api -X DELETE repos/${{ github.repository }}/git/refs/tags/v3.1.0
          gh api -X POST repos/${{ github.repository }}/git/refs -f ref=refs/tags/v3.1.0 -f sha=4405a1ba2a8b6ddfcc56e2e736c56f0a53e380a9
          gh api repos/${{ github.repository }}/git/refs/tags/v3.1.0 --jq '.object.sha'
