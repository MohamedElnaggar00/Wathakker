name: Wear 3.3.0 signed watch APK (NO RELEASE)
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  wear:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: temurin
    - uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 9.3.1
    - name: Generate placeholder keystore (build input only, replaced by release signing below)
      run: keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "C=US, O=Android, CN=Android Debug"
    - name: Build watch release APK
      run: |
        set -o pipefail
        gradle :wear:assembleRelease -PwithWear=true -PcomposeBom=2025.10.01 --no-daemon --no-build-cache --no-configuration-cache -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8 -Djava.awt.headless=true" 2>&1 | tee wear-build.log
    - name: Sign with release key
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      run: |
        bash -c 'set -euo pipefail
        umask 077
        work=$(mktemp -d)
        for name in KEYSTORE_BASE64 KEY_ALIAS; do
          if [ -z "${!name}" ]; then echo "Missing signing secret: $name"; exit 1; fi
        done
        printf "%s" "$KEYSTORE_BASE64" | base64 --decode > "$work/source.bks"
        curl --fail --silent --show-error --location https://repo.maven.apache.org/maven2/org/bouncycastle/bcprov-jdk18on/1.78.1/bcprov-jdk18on-1.78.1.jar -o "$work/bcprov.jar"
        echo "add5915e6acfc6ab5836e1fd8a5e21c6488536a8c1f21f386eeb3bf280b702d7  $work/bcprov.jar" | sha256sum --check
        cp 1-ConvertBks.java "$work/ConvertBks.java"
        javac -cp "$work/bcprov.jar" -d "$work" "$work/ConvertBks.java"
        java -cp "$work:$work/bcprov.jar" ConvertBks "$work/source.bks" "$work/signing.p12"
        BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
        ls wear/build/outputs/apk/release/
        APK=$(ls wear/build/outputs/apk/release/*.apk | head -1)
        mkdir -p out
        "$BT/zipalign" -f -p 4 "$APK" "$work/aligned.apk"
        "$BT/apksigner" sign --ks "$work/signing.p12" --ks-type PKCS12 --ks-key-alias "$KEY_ALIAS" --ks-pass env:KEY_PASSWORD --key-pass env:KEY_PASSWORD --out out/Wathakker-Wear-3.3.0.apk "$work/aligned.apk"
        "$BT/apksigner" verify --verbose --print-certs out/Wathakker-Wear-3.3.0.apk > out/signature.txt
        "$BT/aapt2" dump badging out/Wathakker-Wear-3.3.0.apk | head -12 > out/package.txt
        sha256sum out/Wathakker-Wear-3.3.0.apk > out/SHA256SUMS
        cat out/signature.txt | head -8'
    - uses: actions/upload-artifact@v4
      with:
        name: wear-signed
        path: out/
