name: alarm repro2 (NO RELEASE)
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  repro:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - name: Download released APKs
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        mkdir -p apks
        gh release download v3.3.0 --repo ${{ github.repository }} -p 'Wathkkir-3.3.0.apk' -D apks
        gh release download v3.3.1 --repo ${{ github.repository }} -p 'Wathkkir-3.3.1.apk' -D apks
        ls -l apks
    - name: Enable KVM
      run: |-
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: Emulator
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 35
        arch: x86_64
        target: default
        profile: pixel_6
        script: |-
          bash tools/emu_alarm.sh apks/Wathkkir-3.3.0.apk apks/Wathkkir-3.3.1.apk emulator-evidence/alarm
    - name: Upload evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: alarm-evidence
        path: emulator-evidence/alarm/
        retention-days: 14
