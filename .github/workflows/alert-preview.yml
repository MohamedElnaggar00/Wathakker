name: Adhan alert style preview (NO RELEASE)
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  phone:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: temurin
    - uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 9.3.1
    - name: Generate Debug Keystore
      run: keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "C=US, O=Android, CN=Android Debug"
    - name: Build debug APK
      run: set -o pipefail; gradle :app:assembleDebug -PcomposeBom=2025.10.01 --no-daemon --no-build-cache --no-configuration-cache -Dorg.gradle.jvmargs="-Xmx3g" 2>&1 | tee build.log | tail -30
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: alert-build-log
        path: build.log
    - name: Enable KVM
      run: |-
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: Phone emulator alert preview
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 34
        arch: x86_64
        target: google_apis
        profile: pixel_6
        script: bash tools/phone_alert_preview.sh app/build/outputs/apk/debug/app-debug.apk emulator-evidence/alert
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: alert-evidence
        path: emulator-evidence/alert/
