name: Phone widget_all (branch-only repurpose, NO RELEASE)
'on':
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with: {java-version: '17', distribution: temurin}
    - uses: gradle/actions/setup-gradle@v3
      with: {gradle-version: 9.3.1}
    - name: Debug APK
      run: |-
        keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "C=US, O=Android, CN=Android Debug"
        set -o pipefail; gradle :app:assembleDebug -PcomposeBom=2025.10.01 --no-daemon --no-build-cache --no-configuration-cache -Dorg.gradle.jvmargs="-Xmx3g" > build.log 2>&1 || { grep -E "^e: |error:|What went wrong" -A4 build.log | head -60; exit 1; }; tail -3 build.log
    - name: Enable KVM
      run: |-
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 34
        arch: x86_64
        target: google_apis
        profile: pixel_tablet
        disable-animations: true
        script: bash tools/narrow_sheet.sh app/build/outputs/apk/debug/app-debug.apk emulator-evidence/ns
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: narrow-sheet
        path: emulator-evidence/ns/
