name: Phone Friday + city-edit preview evidence (NO RELEASE)
'on':
  workflow_dispatch:
    inputs:
      signed_run_id:
        description: 'Run ID of a signed release build to test instead of building debug'
        required: false
        default: ''
      render_alias:
        description: 'Set to 1 for alias-placement render-only pass (debug build)'
        required: false
        default: ''
permissions:
  contents: read
  actions: read
jobs:
  phone:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: temurin
    - uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 9.3.1
    - name: Generate Debug Keystore
      run: keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "C=US, O=Android, CN=Android Debug"
    - name: Build debug APK
      if: ${{ inputs.signed_run_id == '' }}
      run: set -o pipefail; gradle :app:assembleDebug -PcomposeBom=2025.10.01 --no-daemon --no-build-cache --no-configuration-cache -Dorg.gradle.jvmargs="-Xmx3g" 2>&1 | tee build.log | tail -30
    - name: Download signed APK
      if: ${{ inputs.signed_run_id != '' }}
      uses: actions/download-artifact@v4
      with:
        name: app-release-bom-2025.10.01.apk
        run-id: ${{ inputs.signed_run_id }}
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: signed-apk/
    - name: Verify WidgetRenderCheck non-exported in signed APK
      if: ${{ inputs.signed_run_id != '' }}
      run: |
        mkdir -p emulator-evidence
        AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt | sort -V | tail -1)
        $AAPT dump xmltree signed-apk/app-release-unsigned.apk AndroidManifest.xml > emulator-evidence/manifest_dump.txt 2>&1 || echo "aapt dump failed" > emulator-evidence/manifest_dump.txt
        grep -B3 -A3 -i "WidgetRenderCheck" emulator-evidence/manifest_dump.txt > emulator-evidence/manifest_check.txt || echo "WidgetRenderCheck NOT FOUND in manifest" > emulator-evidence/manifest_check.txt
    - name: Enable KVM
      run: |-
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: Phone emulator evidence
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 34
        arch: x86_64
        target: google_apis
        profile: pixel_6
        script: bash tools/phone_friday.sh "${{ inputs.signed_run_id != '' && 'signed-apk/app-release-unsigned.apk' || 'app/build/outputs/apk/debug/app-debug.apk' }}" emulator-evidence/friday "${{ inputs.signed_run_id != '' && '1' || '' }}" "${{ inputs.render_alias == '1' && 'RENDER_ALIAS' || '' }}"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: friday-evidence
        path: emulator-evidence/friday/
