name: Widget diagnostics screen check (NO RELEASE)
'on':
  workflow_dispatch:
    inputs:
      run_id:
        description: 'build-apk run id (release artifact)'
        required: true
permissions:
  contents: read
  actions: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {tag: release-tablet, profile: pixel_tablet, bind: 'no'}
          - {tag: debug-tablet, profile: pixel_tablet, bind: 'yes'}
          - {tag: debug-phone, profile: pixel_6, bind: 'yes'}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with: {java-version: '17', distribution: temurin}
    - uses: gradle/actions/setup-gradle@v3
      with: {gradle-version: 9.3.1}
    - name: Release APK
      if: matrix.bind == 'no'
      env: {GH_TOKEN: '${{ github.token }}'}
      run: |-
        mkdir -p dl
        gh run download ${{ inputs.run_id }} --repo ${{ github.repository }} -n app-release-bom-2025.10.01.apk -D dl
        ls -la dl
    - name: Debug APK
      if: matrix.bind == 'yes'
      run: |-
        keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "C=US, O=Android, CN=Android Debug"
        set -o pipefail; gradle :app:assembleDebug -PcomposeBom=2025.10.01 --no-daemon --no-build-cache --no-configuration-cache -Dorg.gradle.jvmargs="-Xmx3g" 2>&1 | tail -5
    - name: Enable KVM
      run: |-
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: Emulator
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 34
        arch: x86_64
        target: google_apis
        profile: ${{ matrix.profile }}
        disable-animations: true
        script: bash tools/diag_check.sh "$(ls dl/*.apk app/build/outputs/apk/debug/app-debug.apk 2>/dev/null | head -1)" emulator-evidence/${{ matrix.tag }} ${{ matrix.bind }}
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: diag-${{ matrix.tag }}
        path: emulator-evidence/${{ matrix.tag }}/
