name: Phone tablet and widget-tap evidence (NO RELEASE)
'on':
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  tablet:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: temurin
    - uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 9.3.1
    - name: Generate Debug Keystore
      run: keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "C=US, O=Android, CN=Android Debug"
    - name: Build debug APK
      run: set -o pipefail; gradle :app:assembleDebug -PcomposeBom=2025.10.01 --no-daemon --no-build-cache --no-configuration-cache -Dorg.gradle.jvmargs="-Xmx3g" 2>&1 | tee build.log | tail -30
    - name: Enable KVM
      run: |-
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: Tablet emulator evidence
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 34
        arch: x86_64
        target: google_apis
        profile: pixel_tablet
        disable-animations: true
        script: bash tools/phone_tablet.sh app/build/outputs/apk/debug/app-debug.apk emulator-evidence/tablet
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: tablet-evidence
        path: emulator-evidence/tablet/
    - name: Gate on substantive results
      if: always()
      run: |-
        d=emulator-evidence/tablet
        fail=0
        grep -q "isn't responding" $d/shots.txt 2>/dev/null && { echo "system dialog in a capture"; fail=1; }
        grep -q 'widget_tap_[0-9]*.*none' $d/tap_pref.txt 2>/dev/null || { echo "pref widget_tap_<id>=none not saved"; fail=1; }
        exit $fail
