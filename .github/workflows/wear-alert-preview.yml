name: Wear adhan alert style preview (NO RELEASE)
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  wear:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: temurin
    - uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 9.3.1
    - name: Generate Debug Keystore
      run: keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "C=US, O=Android, CN=Android Debug"
    - name: Build watch APK
      run: |
        set -o pipefail
        gradle :wear:assembleDebug -PwithWear=true -PcomposeBom=2025.10.01 --no-daemon --no-build-cache --no-configuration-cache -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8 -Djava.awt.headless=true" 2>&1 | tee wear-alert-build.log
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: wear-alert-build-log
        path: wear-alert-build.log
    - name: Enable KVM
      run: |-
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: Wear emulator adhan alert evidence
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 34
        arch: x86_64
        target: android-wear
        profile: wearos_large_round
        disable-animations: false
        script: bash tools/emu_wear_alert.sh wear/build/outputs/apk/debug/wear-debug.apk emulator-evidence/wear-alert
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: wear-alert-evidence
        path: emulator-evidence/wear-alert/
