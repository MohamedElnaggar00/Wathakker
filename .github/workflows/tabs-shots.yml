name: README screenshots (NO RELEASE)
'on':
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: temurin
    - uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 9.3.1
    - name: Generate Debug Keystore
      run: keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "C=US, O=Android, CN=Android Debug"
    - name: Build APK
      run: |
        set -o pipefail
        gradle assembleRelease -PcomposeBom=2025.10.01 --no-daemon --no-build-cache --no-configuration-cache -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8 -Djava.awt.headless=true" 2>&1 | tee build.log
    - name: Package
      run: |
        mkdir -p candidate
        BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
        "$BT/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
        "$BT/apksigner" sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android --ks-key-alias androiddebugkey --out candidate/onb.apk aligned.apk
    - name: Enable KVM
      run: |-
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: Emulator onboarding
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 35
        arch: x86_64
        target: default
        profile: pixel_6
        disable-animations: false
        script: |-
          bash tools/emu_tabs.sh candidate/onb.apk emulator-evidence/tabs
    - name: Upload evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Wathakker-tabs-evidence
        path: emulator-evidence/tabs/
        retention-days: 14
    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Wathakker-tabs-buildlog
        path: build.log
        retention-days: 7
