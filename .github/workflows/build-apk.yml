name: Build Android APK

# Build from source and upload the debug APK as a workflow artifact.
# Each successful build publishes a pre-release tagged v3.0.6-pre.<run number> (user's standing instruction).
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bom: ['2025.10.01']
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      - name: Generate Debug Keystore
        run: keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "C=US, O=Android, CN=Android Debug"

      - name: Build APK
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          gradle assembleDebug -PcomposeBom=${{ matrix.bom }} --no-daemon --no-build-cache --no-configuration-cache -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8 -Djava.awt.headless=true" 2>&1 | tee build.log

      - name: Save build log summary
        run: |
          mkdir -p build-logs
          F=build-logs/run-${{ github.run_number }}-bom-${{ matrix.bom }}.txt
          { echo "outcome: ${{ steps.build.outcome }}  bom: ${{ matrix.bom }}  run: ${{ github.run_id }}  sha: ${{ github.sha }}"; echo "errors: $(grep -c 'error:' build.log)"; echo "--- per file"; grep -o '[A-Za-z0-9_$]*\.java:[0-9]*: error' build.log | sed -E 's/:[0-9]+: error//' | sort | uniq -c | sort -rn | head -80; echo "--- per symbol"; grep -A3 "error: cannot find symbol" build.log | grep -o 'symbol: .*' | sed -E 's/\(.*//' | sort | uniq -c | sort -rn | head -60; echo "kotlin errors: $(grep -c '^e: ' build.log)"; echo "--- kotlin per file"; grep '^e: ' build.log | sed -E 's#^e: file://.*/([A-Za-z0-9_$]+\.kt):[0-9]+:[0-9]+.*#\1#' | sort | uniq -c | sort -rn | head -40; echo "--- kotlin details"; grep '^e: ' build.log | sed -E 's#file:///home/runner/work/Wathakker/Wathakker/app/src/main/java/##' | cut -c1-260 | head -400; echo "--- details"; grep -n -A4 -E "error:|What went wrong|Execution failed|BUILD" build.log | head -700; } > $F
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $F
          git commit -m "build-logs: bom ${{ matrix.bom }} run ${{ github.run_id }}" || echo "no log change"
          for i in 1 2 3 4; do git pull --rebase origin main && git push origin HEAD:main && break; sleep $((RANDOM % 8 + 2)); done

      - name: Upload APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-bom-${{ matrix.bom }}.apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish pre-release
        if: steps.build.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=v3.0.6-pre.${{ github.run_number }}
          cp app/build/outputs/apk/debug/app-debug.apk Wathakker-$TAG.apk
          cat > notes.md <<'NOTES'
          Wathakker 3.0.6 pre-release build for testing (debug-signed).
          NOTES
          gh release create "$TAG" Wathakker-$TAG.apk --target ${{ github.sha }} --prerelease --title "Wathakker 3.0.6 pre-release ${{ github.run_number }}" --notes-file notes.md

      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1


