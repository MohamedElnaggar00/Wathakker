name: bootstrap-reference

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack decompile reference
        run: |
          mkdir -p reference/decompiled
          unzip -oq 1-wathakker-v3.0.6-decompiled.zip -d reference/decompiled
          find reference/decompiled -type f | wc -l
      - name: Commit to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reference/decompiled
          git commit -m "reference: decompiled v3.0.6 (apktool + partial jadx), no release" || echo "nothing to commit"
          git push origin HEAD:main
