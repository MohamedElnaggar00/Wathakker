name: Move gallery PNGs to Screenshot (one-off)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: git mv verify310 PNGs into Screenshot/
        run: |
          set -e
          mkdir -p Screenshot
          git mv emulator-evidence/verify310/*.png Screenshot/
          git mv emulator-evidence/verify310/widget-renders Screenshot/widget-renders
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Move verify310 gallery PNGs to Screenshot/ for the README gallery"
          git push
