name: Emulator compare 3.0.6
# Installs the reference 3.0.6 APK and the source-built debug APK on an emulator,
# walks the home screen and bottom bar, and commits screenshots plus logs.
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Build Android APK run id to take the debug APK from
        required: true
permissions:
  contents: write
  actions: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: app-debug-bom-2025.10.01.apk
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
          path: built
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Walk both builds
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            bash tools/emu_walk.sh 2-Wathakker-V3.0.6-41218fbf.apk emulator-evidence/ref
            bash tools/emu_walk.sh built/app-debug.apk emulator-evidence/built
      - name: Commit evidence
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add emulator-evidence
          git commit -m "emulator-evidence run ${{ github.run_id }} [skip ci]" || echo none
          for i in 1 2 3 4; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
