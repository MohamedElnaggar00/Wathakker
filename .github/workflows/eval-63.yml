name: Evaluation of release assets (NO RELEASE, read-only)
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Fetch APKs
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        mkdir -p apks
        gh release download v3.3.0 -p Wathakker-3.3.0.apk -D apks -R ${{ github.repository }}
        gh release download v3.2.3 -p Wathakker-3.2.3.apk -D apks -R ${{ github.repository }}
        sha256sum apks/*
    - name: Enable KVM
      run: |-
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: Emulator evaluation
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 35
        arch: x86_64
        target: default
        profile: pixel_6
        disable-animations: false
        script: |-
          bash tools/emu_eval.sh apks/Wathakker-3.3.0.apk apks/Wathakker-3.2.3.apk emulator-evidence/eval
    - name: Upload evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Wathakker-eval-evidence
        path: emulator-evidence/eval/
        retention-days: 14
