name: Widget live repro (A/B minify)
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build-nominify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'
      - name: Flip minify/shrink off (DIAGNOSTIC build, versionCode 43)
        run: |
          sed -i 's/isMinifyEnabled = true/isMinifyEnabled = false/; s/isShrinkResources = true/isShrinkResources = false/; s/versionCode = 42/versionCode = 43/' app/build.gradle.kts
          grep -nE 'versionCode|isMinify|isShrink' app/build.gradle.kts
      - name: Build APK
        run: gradle assembleRelease -PcomposeBom=2025.10.01 --no-daemon --no-build-cache --no-configuration-cache -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8 -Djava.awt.headless=true" 2>&1 | tee build.log
      - name: Sign with release key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ""
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          bash -c 'set -euo pipefail
          umask 077
          work=$(mktemp -d)
          for name in KEYSTORE_BASE64 KEY_ALIAS; do
            if [ -z "${!name}" ]; then echo "Missing signing secret: $name"; exit 1; fi
          done
          printf "%s" "$KEYSTORE_BASE64" | base64 --decode > "$work/source.bks"
          curl --fail --silent --show-error --location https://repo.maven.apache.org/maven2/org/bouncycastle/bcprov-jdk18on/1.78.1/bcprov-jdk18on-1.78.1.jar -o "$work/bcprov.jar"
          echo "add5915e6acfc6ab5836e1fd8a5e21c6488536a8c1f21f386eeb3bf280b702d7  $work/bcprov.jar" | sha256sum --check
          cp 1-ConvertBks.java "$work/ConvertBks.java"
          javac -cp "$work/bcprov.jar" -d "$work" "$work/ConvertBks.java"
          java -cp "$work:$work/bcprov.jar" ConvertBks "$work/source.bks" "$work/signing.p12"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          "$BT/zipalign" -f -p 4 "$APK" "$work/aligned.apk"
          "$BT/apksigner" sign --ks "$work/signing.p12" --ks-type PKCS12 --ks-key-alias "$KEY_ALIAS" --ks-pass env:KEY_PASSWORD --key-pass env:KEY_PASSWORD --out "$APK" "$work/aligned.apk"
          "$BT/apksigner" verify --verbose --print-certs "$APK" > "$work/sig.txt"
          if grep -q 0a8b609561f299eaba4518c57e558d506e3991bd0ac551cc167716241adad55f "$work/sig.txt"; then echo signed-with-original-cert; else echo CERT-MISMATCH; exit 1; fi
          rm -rf "$work"
          ' 2>&1 | tee sign.log; test ${PIPESTATUS[0]} -eq 0
      - uses: actions/upload-artifact@v4
        with:
          name: app-nominify-vc43.apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk

  repro:
    needs: build-nominify
    strategy:
      fail-fast: false
      matrix:
        variant: [published-vc42, nominify-vc43]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Download published v3.1.0 APK (minify ON)
        if: matrix.variant == 'published-vc42'
        run: |
          mkdir -p built
          curl -fL -o built/app.apk https://github.com/MohamedElnaggar00/Wathakker/releases/download/v3.1.0/Wathakker-v3.1.0.apk
          ls -la built/
      - uses: actions/download-artifact@v4
        if: matrix.variant == 'nominify-vc43'
        with:
          name: app-nominify-vc43.apk
          path: built
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
      - name: Normalize artifact name
        run: |
          [ -f built/app-release-unsigned.apk ] && mv built/app-release-unsigned.apk built/app.apk || true
          ls -la built/
      - name: Build widget host APK
        run: bash tools/build_widget_host.sh
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Repro on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: bash tools/emu_widget_repro.sh built/app.apk tools/widgethost/out/widgethost.apk emulator-evidence/widgetrepro ${{ matrix.variant }}
      - name: Commit evidence
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add emulator-evidence
          git commit -m "widget repro ${{ matrix.variant }} run ${{ github.run_id }} [skip ci]" || echo none
          for i in 1 2 3 4; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
