name: Native widget design review renders
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/2-widget-design-review.yml]
permissions:
  contents: read
  actions: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: Wathakker-V3.0.5-private-validated
          run-id: 38192912198
          github-token: ${{ github.token }}
          path: current
      - name: Build isolated render harness with debug key only
        run: |
          set -euo pipefail
          MANAGER=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | head -1)
          "$MANAGER" 'build-tools;36.0.0' 'platforms;android-35'
          unzip -q "$(find . -maxdepth 1 -name '*widget-date-review.zip' -print -quit)" -d audit
          BT="$ANDROID_HOME/build-tools/36.0.0"
          ANDROID="$ANDROID_HOME/platforms/android-35/android.jar"
          mkdir -p audit/classes audit/dex evidence
          javac -encoding UTF-8 -source 8 -target 8 -cp "$ANDROID" -d audit/classes $(find audit/src -name '*.java')
          "$BT/d8" --lib "$ANDROID" --min-api 26 --output audit/dex $(find audit/classes -name '*.class')
          "$BT/aapt2" compile --dir audit/res -o audit/res.zip
          "$BT/aapt2" link -I "$ANDROID" --manifest audit/AndroidManifest.xml -A audit/assets -o audit-unsigned.apk audit/res.zip
          zip -j audit-unsigned.apk audit/dex/classes.dex
          keytool -genkeypair -keystore audit/debug.jks -storepass android -keypass android -alias debug -dname CN=RenderAudit -keyalg RSA -validity 30
          "$BT/zipalign" -f 4 audit-unsigned.apk audit-aligned.apk
          "$BT/apksigner" sign --ks audit/debug.jks --ks-pass pass:android --out audit.apk audit-aligned.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Render actual widget Canvas code and inspect current provider registration
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            set -eu
            adb install -g current/candidate.apk
            adb shell am start -W -n com.wathakker.app/com.example.MainActivity
            sleep 3
            adb shell dumpsys appwidget > evidence/current-provider-registration.txt
            adb install audit.apk
            adb logcat -c
            adb shell am start -W -n com.wathakker.widgetaudit/.MainActivity
            sleep 5
            adb shell dumpsys appwidget > evidence/review-provider-registration.txt
            adb logcat -d -v threadtime > evidence/render-logcat.txt
            adb shell run-as com.wathakker.widgetaudit ls files > evidence/rendered-files.txt
            for file in $(tr -d '\r' < evidence/rendered-files.txt); do adb exec-out run-as com.wathakker.widgetaudit cat files/$file > evidence/$file; done
            adb shell screencap -p /sdcard/render.png
            adb pull /sdcard/render.png evidence/harness-screen.png
            ! grep -q 'FATAL EXCEPTION' evidence/render-logcat.txt
            test -s evidence/proposed-Hero-330x90.png
      - name: Retain render evidence in job log without artifact storage
        if: always()
        run: |
          python3 - <<'PYCODE'
          import zipfile,base64,pathlib
          with zipfile.ZipFile('review-evidence.zip','w',zipfile.ZIP_DEFLATED) as z:
            for p in pathlib.Path('evidence').glob('*'):
              if p.is_file():z.write(p,p.name)
          b=base64.b64encode(pathlib.Path('review-evidence.zip').read_bytes()).decode()
          print('REVIEW_EVIDENCE_BASE64_BEGIN')
          for i in range(0,len(b),3000):print('REVIEWDATA:'+b[i:i+3000])
          print('REVIEW_EVIDENCE_BASE64_END')
          PYCODE
