name: Build and validate approved production widgets 3.0.6
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/2-widget-design-review.yml]
permissions:
  contents: read
  actions: read
jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: Wathakker-V3.0.5-private-validated
          run-id: 38192912198
          github-token: ${{ github.token }}
          path: current
      - name: Compile reviewed renderer and preserve current app bytecode
        run: |
          set -euo pipefail
          echo 'beaa0b6ffef97e340680df43cb139d36d3e536c38aaf2a39224deb90ba1d1490  current/candidate.apk' | sha256sum -c
          MANAGER=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | head -1)
          "$MANAGER" 'build-tools;36.0.0' 'platforms;android-35'
          BT="$ANDROID_HOME/build-tools/36.0.0"
          ANDROID="$ANDROID_HOME/platforms/android-35/android.jar"
          curl -fsSL https://github.com/iBotPeaches/Apktool/releases/download/v3.0.1/apktool_3.0.1.jar -o apktool.jar
          echo 'b947b945b4bc455609ba768d071b64d9e63834079898dbaae15b67bf03bcd362  apktool.jar' | sha256sum -c
          curl -fsSL https://repo.maven.apache.org/maven2/org/smali/baksmali/2.5.2/baksmali-2.5.2.jar -o baksmali.jar
          curl -fsSL https://repo.maven.apache.org/maven2/org/smali/smali/2.5.2/smali-2.5.2.jar -o smali.jar
          mkdir -p lib
          for spec in org/smali/dexlib2/2.5.2/dexlib2-2.5.2 org/smali/util/2.5.2/util-2.5.2 com/google/guava/guava/27.1-android/guava-27.1-android com/beust/jcommander/1.64/jcommander-1.64 org/antlr/antlr/3.5.2/antlr-3.5.2 org/antlr/antlr-runtime/3.5.2/antlr-runtime-3.5.2 org/antlr/stringtemplate/3.2.1/stringtemplate-3.2.1; do curl -fsSL "https://repo.maven.apache.org/maven2/$spec.jar" -o "lib/$(basename "$spec").jar"; done
          unzip -q 1-widget-production-shortfix.zip -d patch
          mkdir -p patch/classes patch/dex runtime-evidence
          javac -encoding UTF-8 -source 8 -target 8 -cp "$ANDROID" -d patch/classes $(find patch/src -name '*.java')
          rm patch/classes/com/example/lockwidgets/LockWidgets*.class patch/classes/com/example/widget/BaseWathakkerWidgetProvider.class
          "$BT/d8" --lib "$ANDROID" --min-api 23 --output patch/dex $(find patch/classes -name '*.class')
          unzip -p current/candidate.apk classes15.dex > original15.dex
          java -cp 'baksmali.jar:lib/*' org.jf.baksmali.Main disassemble original15.dex -o merged
          rm merged/com/example/lockwidgets/HomeWidgets*.smali
          java -cp 'baksmali.jar:lib/*' org.jf.baksmali.Main disassemble patch/dex/classes.dex -o added
          cp -r added/* merged/
          java -cp 'smali.jar:lib/*' org.jf.smali.Main assemble merged -o updated15.dex
          java -jar apktool.jar d -s -f current/candidate.apk -o decoded
          python3 patch/patch.py
          cp updated15.dex decoded/classes15.dex
          java -jar apktool.jar b decoded -o candidate-unsigned.apk
          python3 - <<'PYCODE'
          import zipfile
          a=zipfile.ZipFile('current/candidate.apk');b=zipfile.ZipFile('candidate-unsigned.apk')
          for n in a.namelist():
            if n.endswith('.dex') and n!='classes15.dex':assert a.read(n)==b.read(n),n
          PYCODE
          python3 - <<'PYHOST'
          from pathlib import Path
          p=Path('patch/host/AndroidManifest.xml');s=p.read_text();s=s.replace('<uses-permission','<queries><package android:name="com.wathakker.app"/></queries><uses-permission',1);p.write_text(s)
          PYHOST
          mkdir -p host-classes host-dex
          javac -encoding UTF-8 -source 8 -target 8 -cp "$ANDROID" -d host-classes $(find patch/host/src -name '*.java')
          "$BT/d8" --lib "$ANDROID" --min-api 26 --output host-dex $(find host-classes -name '*.class')
          "$BT/aapt2" link -I "$ANDROID" --min-sdk-version 26 --target-sdk-version 35 --manifest patch/host/AndroidManifest.xml -o host-unsigned.apk
          zip -j host-unsigned.apk host-dex/classes.dex
          keytool -genkeypair -keystore host.jks -storepass android -keypass android -alias debug -dname CN=WidgetRuntimeTest -keyalg RSA -validity 30
          "$BT/zipalign" -f 4 host-unsigned.apk host-aligned.apk
          "$BT/apksigner" sign --ks host.jks --ks-pass pass:android --out widget-host.apk host-aligned.apk
      - name: Sign diagnostic candidate with existing Morphe key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          umask 077
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$work/source.bks"
          curl -fsSL https://repo.maven.apache.org/maven2/org/bouncycastle/bcprov-jdk18on/1.78.1/bcprov-jdk18on-1.78.1.jar -o "$work/bcprov.jar"
          echo "add5915e6acfc6ab5836e1fd8a5e21c6488536a8c1f21f386eeb3bf280b702d7  $work/bcprov.jar" | sha256sum -c
          cp 1-ConvertBks.java "$work/ConvertBks.java"
          javac -cp "$work/bcprov.jar" -d "$work" "$work/ConvertBks.java"
          java -cp "$work:$work/bcprov.jar" ConvertBks "$work/source.bks" "$work/signing.p12"
          BT="$ANDROID_HOME/build-tools/36.0.0"
          "$BT/zipalign" -f -p 4 candidate-unsigned.apk "$work/aligned.apk"
          "$BT/apksigner" sign --ks "$work/signing.p12" --ks-type PKCS12 --ks-key-alias "$KEY_ALIAS" --ks-pass env:KEY_PASSWORD --key-pass env:KEY_PASSWORD --out candidate.apk "$work/aligned.apk"
          "$BT/apksigner" verify --verbose --print-certs candidate.apk > runtime-evidence/signature.txt
          grep -q '0a8b609561f299eaba4518c57e558d506e3991bd0ac551cc167716241adad55f' runtime-evidence/signature.txt
          "$BT/aapt2" dump badging candidate.apk > runtime-evidence/package.txt
          grep -q "name='com.wathakker.app' versionCode='12' versionName='3.0.6'" runtime-evidence/package.txt
          sha256sum candidate.apk > runtime-evidence/candidate-sha256.txt
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test clean startup and same-key in-place upgrade
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            set -eu
            adb root
            adb shell settings put global hide_error_dialogs 1
            adb shell am force-stop com.google.android.apps.nexuslauncher
            adb wait-for-device
            adb install -g candidate.apk
            adb shell pm grant com.wathakker.app android.permission.POST_NOTIFICATIONS
            adb shell am force-stop com.android.permissioncontroller
            adb shell am force-stop com.google.android.permissioncontroller
            adb logcat -c
            adb shell am start -S -W -n com.wathakker.app/com.example.MainActivity > runtime-evidence/fresh-launch.txt 2>&1
            sleep 8
            adb shell am force-stop com.google.android.apps.nexuslauncher
            adb logcat -d -v threadtime > runtime-evidence/fresh-logcat.txt
            adb shell pidof com.wathakker.app > runtime-evidence/fresh-pid.txt
            adb shell dumpsys activity activities > runtime-evidence/fresh-activities.txt
            grep -E '(topResumedActivity=|mResumedActivity:).*com.wathakker.app/com.example.MainActivity' runtime-evidence/fresh-activities.txt
            adb shell screencap -p /sdcard/startup.png
            adb pull /sdcard/startup.png runtime-evidence/fresh-screen.png
            adb shell uiautomator dump /sdcard/fresh.xml
            adb pull /sdcard/fresh.xml runtime-evidence/fresh-ui.xml
            adb shell am force-stop com.wathakker.app
            adb uninstall com.wathakker.app
            adb install -g current/candidate.apk
            adb shell pm grant com.wathakker.app android.permission.POST_NOTIFICATIONS
            adb logcat -c
            adb shell am start -S -W -n com.wathakker.app/com.example.MainActivity > runtime-evidence/old-launch.txt 2>&1
            sleep 8
            adb shell am force-stop com.google.android.apps.nexuslauncher
            adb logcat -d -v threadtime > runtime-evidence/old-logcat.txt
            adb shell am force-stop com.wathakker.app
            adb shell 'find /data/user/0/com.wathakker.app/shared_prefs /data/user/0/com.wathakker.app/databases -type f -exec sha256sum {} \; 2>/dev/null' | sort > runtime-evidence/data-before-upgrade.txt
            test -s runtime-evidence/data-before-upgrade.txt
            adb install -r -g candidate.apk > runtime-evidence/upgrade-install.txt
            adb shell 'find /data/user/0/com.wathakker.app/shared_prefs /data/user/0/com.wathakker.app/databases -type f -exec sha256sum {} \; 2>/dev/null' | sort > runtime-evidence/data-after-upgrade.txt
            diff -u runtime-evidence/data-before-upgrade.txt runtime-evidence/data-after-upgrade.txt > runtime-evidence/data-preservation.diff
            adb shell am force-stop com.android.permissioncontroller
            adb shell am force-stop com.google.android.permissioncontroller
            adb logcat -c
            adb shell am start -S -W -n com.wathakker.app/com.example.MainActivity > runtime-evidence/upgrade-launch.txt 2>&1
            sleep 8
            adb shell am force-stop com.google.android.apps.nexuslauncher
            adb logcat -d -v threadtime > runtime-evidence/upgrade-logcat.txt
            adb shell pidof com.wathakker.app > runtime-evidence/upgrade-pid.txt
            adb shell dumpsys activity activities > runtime-evidence/upgrade-activities.txt
            grep -E '(topResumedActivity=|mResumedActivity:).*com.wathakker.app/com.example.MainActivity' runtime-evidence/upgrade-activities.txt
            adb shell screencap -p /sdcard/upgrade.png
            adb pull /sdcard/upgrade.png runtime-evidence/upgrade-screen.png
            adb shell uiautomator dump /sdcard/upgrade.xml
            adb pull /sdcard/upgrade.xml runtime-evidence/upgrade-ui.xml
            adb shell input tap 970 224
            sleep 2
            adb shell screencap -p /sdcard/drawer.png
            adb pull /sdcard/drawer.png runtime-evidence/drawer-screen.png
            adb shell uiautomator dump /sdcard/drawer.xml
            adb pull /sdcard/drawer.xml runtime-evidence/drawer-ui.xml
            adb shell am start -S -W -n com.wathakker.app/com.example.MainActivity
            sleep 2
            adb shell input tap 120 224
            sleep 2
            adb shell screencap -p /sdcard/settings.png
            adb pull /sdcard/settings.png runtime-evidence/settings-screen.png
            adb shell uiautomator dump /sdcard/settings.xml
            adb pull /sdcard/settings.xml runtime-evidence/settings-ui.xml
            adb shell input keyevent 4
            adb shell am start -S -W -n com.wathakker.app/com.example.MainActivity
            sleep 2
            adb shell input tap 346 2220
            sleep 2
            adb shell screencap -p /sdcard/fajr.png
            adb pull /sdcard/fajr.png runtime-evidence/fajr-screen.png
            adb shell uiautomator dump /sdcard/fajr.xml
            adb pull /sdcard/fajr.xml runtime-evidence/fajr-ui.xml
            adb shell am start -S -W -n com.wathakker.app/com.example.MainActivity
            sleep 2
            adb shell input tap 735 2220
            sleep 2
            adb shell screencap -p /sdcard/azkar.png
            adb pull /sdcard/azkar.png runtime-evidence/azkar-screen.png
            adb shell am start -S -W -n com.wathakker.app/com.example.MainActivity
            sleep 2
            adb shell input tap 540 2220
            sleep 2
            adb shell screencap -p /sdcard/hisn.png
            adb pull /sdcard/hisn.png runtime-evidence/hisn-screen.png
            adb shell am start -S -W -n com.wathakker.app/com.example.MainActivity
            sleep 2
            adb shell input tap 150 2220
            sleep 2
            adb shell input tap 150 2220
            sleep 2
            adb shell screencap -p /sdcard/tasbih.png
            adb pull /sdcard/tasbih.png runtime-evidence/tasbih-screen.png
            adb logcat -d -v threadtime > runtime-evidence/navigation-logcat.txt
            adb shell pidof com.wathakker.app > runtime-evidence/navigation-pid.txt
            ! grep -q 'FATAL EXCEPTION' runtime-evidence/fresh-logcat.txt
            ! grep -q 'FATAL EXCEPTION' runtime-evidence/upgrade-logcat.txt
            ! grep -q 'FATAL EXCEPTION' runtime-evidence/navigation-logcat.txt
            adb shell dumpsys appwidget > runtime-evidence/provider-registration.txt
            grep -q HeroLargeWidgetProvider runtime-evidence/provider-registration.txt
            adb install widget-host.apk
            adb shell appwidget grantbind --package com.wathakker.widgettest --user 0
            adb logcat -c
            adb shell am start -W -n com.wathakker.widgettest/.MainActivity
            sleep 3
            adb logcat -d -v threadtime > runtime-evidence/widget-start-logcat.txt
            for i in $(seq 1 60); do adb shell run-as com.wathakker.widgettest test -f files/TEST-DONE && break; sleep 2; done
            adb shell run-as com.wathakker.widgettest test -f files/TEST-DONE
            adb logcat -d -v threadtime > runtime-evidence/widget-logcat.txt
            adb shell dumpsys appwidget > runtime-evidence/bound-provider-registration.txt
            adb shell run-as com.wathakker.widgettest ls files > runtime-evidence/widget-files.txt
            for file in $(tr -d '\r' < runtime-evidence/widget-files.txt); do adb exec-out run-as com.wathakker.widgettest cat files/$file > runtime-evidence/$file; done
            adb shell screencap -p /sdcard/host.png
            adb pull /sdcard/host.png runtime-evidence/host-screen.png
            ! grep -E 'FATAL EXCEPTION|WathakkerHome.*(failed|Failed)' runtime-evidence/widget-logcat.txt

      - name: Retain candidate and all evidence in logs even if artifact quota is full
        if: always()
        run: |
          python3 - <<'PYCODE'
          import zipfile,base64,pathlib
          with zipfile.ZipFile('production-evidence.zip','w',zipfile.ZIP_DEFLATED) as z:
            for p in pathlib.Path('runtime-evidence').glob('*'):
              if p.is_file():z.write(p,'evidence/'+p.name)
            if pathlib.Path('candidate.apk').exists():z.write('candidate.apk','Wathakker-V3.0.6.apk')
          b=base64.b64encode(pathlib.Path('production-evidence.zip').read_bytes()).decode()
          print('PRODUCTION_EVIDENCE_BASE64_BEGIN')
          for i in range(0,len(b),3000):print('PRODDATA:'+b[i:i+3000])
          print('PRODUCTION_EVIDENCE_BASE64_END')
          PYCODE
