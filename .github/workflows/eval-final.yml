name: Final evaluation build (NO RELEASE, read-only)
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: temurin
    - uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 9.3.1
    - name: Generate Debug Keystore
      run: keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "C=US, O=Android, CN=Android Debug"
    - name: Build APK
      run: |
        set -o pipefail
        gradle assembleRelease -PcomposeBom=2025.10.01 --no-daemon --no-build-cache --no-configuration-cache -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8 -Djava.awt.headless=true" 2>&1 | tee build.log
    - name: Sign with release key
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ''
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      run: |
        bash -c 'set -euo pipefail
        umask 077
        work=$(mktemp -d)
        for name in KEYSTORE_BASE64 KEY_ALIAS; do
          if [ -z "${!name}" ]; then echo "Missing signing secret: $name"; exit 1; fi
        done
        printf "%s" "$KEYSTORE_BASE64" | base64 --decode > "$work/source.bks"
        curl --fail --silent --show-error --location https://repo.maven.apache.org/maven2/org/bouncycastle/bcprov-jdk18on/1.78.1/bcprov-jdk18on-1.78.1.jar -o "$work/bcprov.jar"
        echo "add5915e6acfc6ab5836e1fd8a5e21c6488536a8c1f21f386eeb3bf280b702d7  $work/bcprov.jar" | sha256sum --check
        cp 1-ConvertBks.java "$work/ConvertBks.java"
        javac -cp "$work/bcprov.jar" -d "$work" "$work/ConvertBks.java"
        java -cp "$work:$work/bcprov.jar" ConvertBks "$work/source.bks" "$work/signing.p12"
        BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
        APK=app/build/outputs/apk/release/app-release-unsigned.apk
        "$BT/zipalign" -f -p 4 "$APK" "$work/aligned.apk"
        "$BT/apksigner" sign --ks "$work/signing.p12" --ks-type PKCS12 --ks-key-alias "$KEY_ALIAS" --ks-pass env:KEY_PASSWORD --key-pass env:KEY_PASSWORD --out "$APK" "$work/aligned.apk"
        "$BT/apksigner" verify --verbose --print-certs "$APK" > "$work/sig.txt"
        if grep -q 0a8b609561f299eaba4518c57e558d506e3991bd0ac551cc167716241adad55f "$work/sig.txt"; then echo signed-with-original-cert; else echo CERT-MISMATCH; exit 1; fi
        rm -rf "$work"
        ' 2>&1 | tee sign.log; test ${PIPESTATUS[0]} -eq 0
    - name: Package
      run: |
        mkdir -p candidate
        cp app/build/outputs/apk/release/app-release-unsigned.apk candidate/onb.apk
    - name: Fetch previous release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        mkdir -p apks
        gh release download v3.2.3 -p Wathakker-3.2.3.apk -D apks -R ${{ github.repository }}
    - name: Enable KVM
      run: |-
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: Emulator evaluation
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 35
        arch: x86_64
        target: default
        profile: pixel_6
        disable-animations: false
        script: |-
          bash tools/emu_eval.sh candidate/onb.apk apks/Wathakker-3.2.3.apk emulator-evidence/eval
    - name: Upload evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Wathakker-eval-final-evidence
        path: emulator-evidence/eval/
        retention-days: 14
    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Wathakker-eval-final-buildlog
        path: build.log
        retention-days: 7
